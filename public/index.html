<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        
        <header class="page-header">
            <h1>Customer Management System</h1>
            <p>Manage your customer records easily in one place.</p>
        </header>

        
        <div class="dashboard-cards">
            <div class="dashboard-card">
                <p>Total Customers</p>
                <h2 id="totalCustomers">0</h2>
            </div>

            <div class="dashboard-card">
                <p>Matching Customers</p>
                <h2 id="matchingCustomers">0</h2>
            </div>
        </div>

        <!-- Customer Form -->
        <div class="form-container">

            <h2 id="formTitle">Add Customer</h2>

            <form id="customerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Customer Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number"
                    maxlength="10"
                    required
                >

                <button type="submit" id="submitBtn">
                    Add Customer
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </form>

        </div>


        <!-- Customer List -->

        <div class="customers-container">

            <div class="list-header">
                <h2>Customer List</h2>
                <span id="customerCount">Total Customers: 0</span>
            </div>

            
            <div class="customer-toolbar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, email or phone"
                >

                <button type="button" id="clearSearchBtn" class="secondary-btn">
                    Clear
                </button>

                <select id="sortOrder" aria-label="Sort customers">
                    <option value="asc">Name: A to Z</option>
                    <option value="desc">Name: Z to A</option>
                </select>

                <button type="button" id="exportBtn">
                    Export to CSV
                </button>
            </div>

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="customerList">

                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
